name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gists-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
      - run: docker build -t gists-api:${{ github.sha }} .
      - run: |
          docker run -d -p 8080:8080 --name smoke gists-api:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8080/_health